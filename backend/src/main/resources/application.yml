spring:
  application:
    name: pesquisa-satisfacao
  jackson:
    default-property-inclusion: always

  # Banco: Supabase (Postgres). O Supabase deste grupo e compartilhado com
  # outro sistema (bot de Teams) que usa o schema "public" — por isso nossas
  # tabelas ficam isoladas no schema "pesquisa_satisfacao" (ver
  # src/main/resources/db/schema-supabase.sql). Exige as variaveis de
  # ambiente DB_URL, DB_USUARIO e DB_SENHA — sem elas o backend nao sobe.
  datasource:
    url: ${DB_URL}
    username: ${DB_USUARIO}
    password: ${DB_SENHA}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        default_schema: pesquisa_satisfacao

  # SMTP do Resend (https://resend.com/docs/send-with-smtp): host e usuario ja
  # vem com o valor padrao do proprio Resend, so falta a senha (a API key,
  # criada no dashboard em Resend > API Keys) e o remetente verificado.
  # Porta 465 = SSL implicito (nao e STARTTLS, por isso ssl.enable em vez de starttls).
  mail:
    host: ${SMTP_HOST:smtp.resend.com}
    port: ${SMTP_PORT:465}
    username: ${SMTP_USUARIO:resend}
    password: ${SMTP_SENHA:}
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true

server:
  # Render injeta a variavel PORT com a porta que o servico deve escutar;
  # localmente cai no 8080 de sempre.
  port: ${PORT:8080}

app:
  jwt:
    # Em producao use a variavel de ambiente JWT_SEGREDO.
    segredo: ${JWT_SEGREDO:chave-secreta-do-projeto-de-faculdade-pesquisa-satisfacao-2026}
    expiracao-ms: 28800000
  frontend:
    url: ${FRONTEND_URL:http://localhost:5173}
  backend:
    # URL publica desta API, usada para montar os links dos botoes do cartao do Teams.
    url: ${BACKEND_URL:http://localhost:8080}
  teams:
    # URL do webhook do Teams (Conector "Incoming Webhook" ou app "Workflows").
    # Sem essa variavel, o envio ao Teams e apenas pulado (log de aviso).
    # Nao usado mais no fluxo de encerramento (substituido pelo e-mail via Resend
    # abaixo); mantido caso queiram reativar.
    webhook-url: ${TEAMS_WEBHOOK_URL:}
  email:
    # Sem dominio proprio verificado no Resend (dashboard > Domains), o unico
    # remetente valido e onboarding@resend.dev (dominio de teste do proprio
    # Resend) — e so entrega para o e-mail dono da conta/API key. Quando
    # verificarem um dominio, trocar via EMAIL_REMETENTE (aceita so o
    # endereco ou "Nome <email@dominio>").
    remetente: ${EMAIL_REMETENTE:CIT <onboarding@resend.dev>}
    assunto: ${EMAIL_ASSUNTO:Pesquisa de satisfação - CIT}
    # Quanto tempo apos o encerramento do chamado o e-mail e enviado ao cliente.
    # Configurado pelo atendente da conta de atendimento; exige reiniciar o backend.
    atraso-minutos: ${EMAIL_ATRASO_MINUTOS:0}
  anexos:
    tamanho-maximo-bytes: 5242880 # 5 MB

logging:
  level:
    com.faculdade.pesquisa: INFO

# Precisa cobrir o limite acima (spring.servlet.multipart tem seu proprio limite,
# separado de app.anexos.tamanho-maximo-bytes) para o upload nao ser cortado antes
# da validacao de negocio.
spring.servlet.multipart:
  max-file-size: 6MB
  max-request-size: 6MB
